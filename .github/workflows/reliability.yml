name: Reliability baseline
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-research.txt
      - run: python -m pytest -q tests
        working-directory: backend
      - run: python experiments/audit_evidence.py evidence/ham10000
      - run: python experiments/audit_evidence.py evidence/resnet18
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run build
        working-directory: frontend

