name: Real HAM10000 benchmark
on:
  workflow_dispatch:
  push:
    branches: [codex/reliability-foundations]
    paths:
      - backend/train.py
      - backend/pretrained_benchmark.py
      - backend/download_ham10000.py
      - .github/workflows/real-benchmark.yml
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-research.txt
      - run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python backend/download_ham10000.py
      - run: python backend/train.py --metadata data/ham10000/metadata.csv --images data/ham10000/images --output artifacts/ham10000 --data-mode HAM10000
      - uses: actions/upload-artifact@v4
        with:
          name: ham10000-baseline-${{ github.sha }}
          path: artifacts/ham10000/
          retention-days: 90
          if-no-files-found: error
      - run: python backend/pretrained_benchmark.py --manifest artifacts/ham10000/split_manifest.csv --images data/ham10000/images --output artifacts/resnet18
      - uses: actions/upload-artifact@v4
        with:
          name: ham10000-resnet18-${{ github.sha }}
          path: artifacts/resnet18/
          retention-days: 90
          if-no-files-found: error
